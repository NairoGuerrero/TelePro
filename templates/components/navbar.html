{% load static %}

<header id="navbar" class="fixed top-0 left-0 w-full z-50 transition-all duration-300">
    <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <!-- Logo -->
            <a href="{% url 'landing:index' %}" class="flex-shrink-0">
                <img src="{% static 'images/logo.png' %}" alt="Telepro" class="h-8 sm:h-9 w-auto">
            </a>

            <!-- Desktop Menu -->
            <div class="hidden lg:flex items-center space-x-8">
                <a href="{% url 'landing:index' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'index' %}active{% endif %}">Home</a>
<a href="{% url 'landing:about' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>

                <!-- Services Dropdown -->
                <div class="relative group">
<a href="{% url 'landing:services' %}" class="nav-link-custom inline-flex items-center {% if request.resolver_match.url_name == 'services' %}active{% endif %}">
                        Services
                        <svg class="ml-1 w-4 h-4 transition-transform duration-200 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </a>
                    <div class="absolute top-full left-0 mt-2 w-72 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
                        <div class="p-3">
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-light transition-colors">
                                <span class="w-2 h-2 bg-primary rounded-full"></span>
                                Loan Servicing Call Center
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-light transition-colors">
                                <span class="w-2 h-2 bg-primary rounded-full"></span>
                                Collections Call Center for Lenders
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-light transition-colors">
                                <span class="w-2 h-2 bg-primary rounded-full"></span>
                                Inbound & Outbound Call Handling
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-light transition-colors">
                                <span class="w-2 h-2 bg-primary rounded-full"></span>
                                Live Chat Support
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-light transition-colors">
                                <span class="w-2 h-2 bg-primary rounded-full"></span>
                                Email Support & Ticket Management
                            </a>
                        </div>
                    </div>
                </div>

<a href="{% url 'landing:features' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'features' %}active{% endif %}">Features</a>
<a href="{% url 'landing:faq' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'faq' %}active{% endif %}">FAQ</a>            </div>

            <!-- Contact Button (Desktop) -->
            <div class="hidden lg:block">
                <a href="{% url 'landing:contact'%}" class="inline-flex items-center px-6 py-2.5 border-2 border-dark rounded-full text-sm font-semibold uppercase tracking-wider hover:bg-dark hover:text-white transition-all duration-300">
                    Contact
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button id="mobile-menu-btn" class="lg:hidden flex items-center p-2" aria-label="Toggle menu">
                <svg id="menu-open-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg id="menu-close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="lg:hidden hidden bg-white rounded-2xl shadow-xl mt-2 p-6 border border-gray-100">
            <div class="flex flex-col space-y-4">
                <a href="{% url 'landing:index' %}" class="text-text-primary font-medium py-2 hover:text-primary transition-colors">Home</a>
                <a href="#about" class="text-text-primary font-medium py-2 hover:text-primary transition-colors">About</a>
                <a href="#services" class="text-text-primary font-medium py-2 hover:text-primary transition-colors">Services</a>
                <a href="#features" class="text-text-primary font-medium py-2 hover:text-primary transition-colors">Features</a>
                <a href="#faq" class="text-text-primary font-medium py-2 hover:text-primary transition-colors">FAQ</a>
                <a href="#contact" class="inline-flex items-center justify-center px-6 py-3 bg-gradient-to-r from-primary-dark to-primary-light text-white font-semibold rounded-full">
                    Contact
                </a>
            </div>
        </div>
    </nav>
</header>

<script>
    // Navbar scroll effect
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            navbar.classList.add('bg-white/90', 'backdrop-blur-md', 'shadow-lg');
        } else {
            navbar.classList.remove('bg-white/90', 'backdrop-blur-md', 'shadow-lg');
        }
    });

    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuOpenIcon = document.getElementById('menu-open-icon');
    const menuCloseIcon = document.getElementById('menu-close-icon');

    mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        menuOpenIcon.classList.toggle('hidden');
        menuCloseIcon.classList.toggle('hidden');
    });

    // Close mobile menu on link click
    mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
            menuOpenIcon.classList.remove('hidden');
            menuCloseIcon.classList.add('hidden');
        });
    });
</script>
